# AI Anki — локальный запуск (Linux / macOS / Windows)
# docker compose up -d --build

services:
  ai-anki:
    build: .
    image: ai-anki-web:latest
    container_name: ai-anki
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AI_ANKI_DATA_DIR: /data
      # open — регистрация открыта; closed — после первого (админского) аккаунта новых не создать
      AI_ANKI_REGISTRATION: open
    volumes:
      - ./data:/data
      - ./decks:/app/decks:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
